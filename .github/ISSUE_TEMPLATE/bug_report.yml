name: PanVK G720 community bug report
description: Report a reproducible problem using an exact PanVK G720 release.
title: "[BUG] "
labels:
  - bug
  - community-test
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing PanVK G720.
        Current public beta: `0.1.0-beta.2`.
        Preserve the original release ZIP and attach only relevant, non-sensitive logs.
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Manufacturer / model
    validations:
      required: true
  - type: input
    id: soc_gpu
    attributes:
      label: SoC / GPU
      placeholder: e.g. MediaTek MT6899 / Mali-G720 MC8
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel / Kbase version
      placeholder: If known
  - type: input
    id: release
    attributes:
      label: PanVK release tag
      value: 0.1.0-beta.2
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: Driver ZIP SHA-256
      placeholder: fc1d69647c071ca3fe30ae2fb450e95c91c08e90779eb32c865fa384dff5aaca
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime path
      options:
        - Native Vulkan
        - Winlator / Vortek
        - Wine / Box64
        - Other
    validations:
      required: true
  - type: input
    id: wrapper
    attributes:
      label: Wrapper / Winlator build
      placeholder: If applicable
  - type: input
    id: translation
    attributes:
      label: DXVK / VKD3D version
      placeholder: If applicable
  - type: input
    id: application
    attributes:
      label: Application / game
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the shortest exact sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: State exactly what happened, including visual artifacts, FPS/frametime changes, app abort, GPU fault, device lost, or reboot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach or paste relevant logs with timestamps. Remove unrelated personal data and secrets.
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity confirmation
      options:
        - label: I tested the original release ZIP without repacking or modifying it.
          required: true
        - label: I verified the ZIP SHA-256 shown above.
          required: true
        - label: I removed credentials, tokens and unrelated personal data from the report.
          required: true
